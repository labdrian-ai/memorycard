version: 2

project_name: memorycard

builds:
  - id: memorycard
    main: ./cmd/memorycard
    binary: memorycard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/labdrian-ai/memorycard/internal/mcpserver.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # git with abbrev -1 lists commit messages only: no hashes, no author emails.
  use: git
  abbrev: -1
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
